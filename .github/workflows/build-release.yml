# Builds a version tag's release files (main.js, manifest.json, styles.css) and passes them on
# as the `release-files` artifact. Called by Publish prerelease and Stable release; nothing else
# runs it. See "Releases" in README.md.
#
# Security: this is the only release job that runs npm dependencies, and it can only read. The
# jobs that publish download its artifact and run no npm. The tag reaches run: steps only through
# env:.
name: Build release

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag to build (plain X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eqx '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'; then
            echo "::error::not a plain X.Y.Z tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      # jq rather than a script in the repo, so older tags build the same way. Main's
      # manifest.json is left alone: it holds the stable version.
      - name: Collect the release files
        run: |
          mkdir dist
          cp main.js styles.css dist/
          jq --arg v "$TAG" '.version = $v' manifest.json > dist/manifest.json
          # The old id `lodestone` belongs to another plugin in the community store.
          id=$(jq -r .id dist/manifest.json)
          if [ "$id" != ai-lodestone ]; then
            echo "::error::manifest id is $id, not ai-lodestone"
            exit 1
          fi
          for f in main.js manifest.json styles.css; do test -s "dist/$f"; done
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          overwrite: true # a re-run of the same workflow run
