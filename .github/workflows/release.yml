# Tags each push to main with the next plain X.Y.Z version, on the merge commit itself, then
# publishes that tag as a prerelease (Publish prerelease). It makes no commit: main's version
# files hold the latest stable version and change only in a stable release. See "Versioning"
# and "Releases" in README.md.
#
# Security: third-party code (npm dependencies) only runs in read-only jobs: `verify` here and
# the build job in Build release. The `tag` job runs nothing but actions/checkout, git and a
# dependency-free script in this repo. It uses GITHUB_TOKEN, so its tag push doesn't start
# other workflows. The prerelease's publish job runs only GitHub's own actions and gh. No commit
# message, PR title or other user-written text is used in a run: step.
name: Release

on:
  push:
    branches: [main]
    # Docs-only changes don't make a release.
    paths:
      - "**"
      - "!**.md"
      - "!.github/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build

  tag:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One tag job at a time. A run still waiting here is cancelled when a newer one queues;
    # its changes ship in the newer tag. The verify jobs run in parallel, so an older merge's
    # tag job can still run after a newer one: check-version.mjs then fails it rather than tag
    # out of order. Don't put other workflows in this group: a merge would cancel them while
    # they wait.
    concurrency:
      group: tag-main
      cancel-in-progress: false
    outputs:
      # The tag on this commit: the one just created or, on a re-run, the highest version tag
      # the commit already has. The prerelease job below needs it: tags pushed with
      # GITHUB_TOKEN don't trigger other workflows.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # No setup-node: it would get the write token as an input. The runner's Node runs the
      # dependency-free script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # tags

      - name: Tag and push
        id: tag
        run: |
          tag=$(node scripts/check-version.mjs next)
          if [ -n "$(git tag -l --points-at "$GITHUB_SHA" "$tag")" ]; then
            echo "$GITHUB_SHA is already tagged $tag"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "AI Lodestone $tag" "$GITHUB_SHA"
            # Not forced: if the tag already exists, the push and the run fail.
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Outside the tag-main group, so a newer merge can't cancel it while it waits.
  prerelease:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-prerelease.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
