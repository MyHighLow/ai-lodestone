# Advisory PR check: tests, build, and confirms the version files agree and the PR doesn't
# change the version. See "Versioning" in README.md.
name: Version check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-version.mjs pr "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
